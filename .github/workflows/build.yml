name: MyGame

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Repo
        uses: actions/checkout@v4

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmdline-tools/16.0
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms/android-34
            /usr/local/lib/android/sdk/build-tools/34.0.0
            /usr/local/lib/android/sdk/ndk/26.3.11579264
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/licenses
          key: ${{ runner.os }}-android-sdk-cmdline-12266719-api-34-build-tools-34.0.0-ndk-26.3.11579264-cmake-3.22.1
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle Caches & CMake FetchContent
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            Platform/Android/app/.cxx
          key: ${{ runner.os }}-android-gradle-${{ hashFiles('Platform/Android/**/*.gradle*', 'Platform/Android/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-

      - name: Decode
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > Platform/Android/mygame.keystore

      - name: SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1

      - name: Build
        working-directory: Platform/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          STORE_FILE: ${{ github.workspace }}/Platform/Android/mygame.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename
        run: |
          mv Platform/Android/app/build/outputs/apk/release/app-release.apk \
          Platform/Android/app/build/outputs/apk/release/MyGame-Android-${{ github.ref_name }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: Platform/Android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest

    steps:
      - name: Repo
        uses: actions/checkout@v4

      - name: Setup & Cache Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.268.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Cache CMake Dependencies (SDL3)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt', 'Platform/Windows/CMakeLists.txt', 'Common/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: CMake
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build

      - name: Rename
        run: |
          ren Executables\Windows\MyGame.exe MyGame-Windows-${{ github.ref_name }}.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: Executables\Windows\MyGame-Windows-${{ github.ref_name }}.exe

  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Repo
        uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build clang cmake \
            libvulkan-dev \
            libwayland-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev

      - name: Cache CMake Dependencies (SDL3)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt', 'Platform/Linux/CMakeLists.txt', 'Common/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: CMake
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build

      - name: Rename
        run: |
          mv Executables/Linux/MyGame \
          Executables/Linux/MyGame-Linux-${{ github.ref_name }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: Executables/Linux/MyGame-Linux-${{ github.ref_name }}